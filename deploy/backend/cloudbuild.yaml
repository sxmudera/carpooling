# Ganti _CLOUD_SQL_INSTANCE di Trigger → Substitution variables
# Format: project-id:region:nama-instance
# Contoh: d-34-489016:asia-southeast2:carpooling-mysql

substitutions:
  _CLOUD_SQL_INSTANCE: 'd-34-489016:us-central1:carpooling'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/backend/Dockerfile', '-t', 'gcr.io/$PROJECT_ID/carpooling-backend', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/carpooling-backend']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - carpooling-backend
      - '--image=gcr.io/$PROJECT_ID/carpooling-backend'
      - '--region=asia-southeast2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars=NODE_ENV=production,CLOUD_SQL_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE}'
images:
  - 'gcr.io/$PROJECT_ID/carpooling-backend'
options:
  logging: CLOUD_LOGGING_ONLY
