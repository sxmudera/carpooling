substitutions:
  _CLOUD_SQL_INSTANCE: 'd-34-489016:us-central1:carpooling'

#build docker image
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/backend/Dockerfile', '-t', 'gcr.io/$PROJECT_ID/carpooling-backend', '.']
    #push image ke container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/carpooling-backend']
    #deploy ke cloud run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - carpooling-backend
      - '--image=gcr.io/$PROJECT_ID/carpooling-backend'
      - '--region=asia-southeast2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--update-env-vars=NODE_ENV=production,CLOUD_SQL_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE}'
images:
  - 'gcr.io/$PROJECT_ID/carpooling-backend'
options:
  logging: CLOUD_LOGGING_ONLY
